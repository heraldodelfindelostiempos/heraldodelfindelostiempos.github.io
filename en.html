lamp(1.05rem,2vw,1.3rem);line-height:1.55;margin:0;color:#e4e8d6}.tarot-front span{font: .81rem/1.35 'Courier New',monospace;color:#d1d8c7}.tarot-front[hidden],.tarot-back[hidden]{display:none}.tarot-actions{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;margin-top:1.6rem}.tarot-reshuffle,.tarot-copy{margin-top:0;border:1px solid #9aaa8b;background:#1a271d;padding:.85rem 1.1rem;font:600 .8rem 'Courier New',monospace;letter-spacing:.1em;cursor:pointer}.tarot-reshuffle:hover,.tarot-reshuffle:focus-visible,.tarot-copy:hover,.tarot-copy:focus-visible{background:#30422e;outline:1px solid #cad8b6;outline-offset:3px}.tarot-copy-status{margin:0!important;font:600 .76rem/1.4 'Courier New',monospace!important;letter-spacing:.06em;color:#d1c58e!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){.tarot-deck{grid-template-columns:repeat(2,minmax(0,1fr))}.tarot-card{min-height:282px}.tarot-back,.tarot-front{min-height:266px}.tarot-front img{height:195px}.tarot-front span{font-size:.77rem}}

<body>
<main>
  <section class="entry" id="entry" aria-label="Entrance"><div class="language-switch entry-language" aria-label="Language / Idioma"><a data-language="es" href="./">ES</a><a data-language="en" href="en.html" aria-current="page">EN</a></div>
    <div class="sigil"><svg class="entry-triangle" viewBox="0 0 440 370" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M22 18 L418 18 L220 352 Z"/><path class="inner" d="M47 32 L393 32 L220 325 Z"/></svg><button class="orb" id="enter" aria-label="Awaken LUX"></button></div>
    <div class="hint">Touch the sphere</div><div class="wake" id="wake" aria-live="polite"></div>
  </section>
  <section class="system" id="system" hidden aria-label="Archive of the Herald">
    <header class="topline"><span class="mark"><span class="tiny-orb" aria-hidden="true"></span> HERALD / LUX</span><div class="header-controls"><span class="status">RESTRICTED ACCESS · 001</span><div class="language-switch" aria-label="Language / Idioma"><a data-language="es" href="./">ES</a><a data-language="en" href="en.html" aria-current="page">EN</a></div></div></header>
    <div class="layout"><nav aria-label="Sections"><button data-room="inicio">INDEX</button>
      <details class="character-menu" id="character-menu"><summary>CHARACTERS <span aria-hidden="true" class="menu-chevron">⌄</span></summary><div class="character-list"><button data-room="heraldo">THE HERALD</button><button data-room="lux">LUX</button><button data-room="doctor">THE DOCTOR</button><button data-room="triada">TRIAD</button><button data-room="sombra">THE SHADOW</button><button data-room="inteligencia">INTELLIGENCE</button><button data-room="tyler">TYLER</button></div></details><button data-room="archivo">ARCHIVE</button><button data-room="ordenes">ORDERS</button><button data-room="vacio">VOID</button><button data-room="tarot">TAROT</button>
    </nav><article class="panel" id="panel" tabindex="-1"></article></div>
    <footer class="foot">THE END OF TIMES &nbsp;·&nbsp; <button class="reset" id="reset">return to entrance</button>
      <section class="footer-game" aria-label="The Herald minigame">
        <div class="game-head"><h2 class="game-title">THE HERALD / ARCADE</h2><div class="game-score">HITS <span id="game-score">0</span></div></div>
        <div class="game-stage"><canvas id="heraldo-game" width="640" height="240" role="img" aria-label="The Herald walks as enemies approach from the right">Game unavailable in this browser.</canvas></div>
        <div class="game-controls"><button type="button" id="game-start">START</button><button type="button" id="game-punch" disabled>PUNCH</button><span class="game-help">SPACE OR BUTTON: PUNCH</span></div>
        <p class="game-status" id="game-status" role="status" aria-live="polite">Press start.</p>
      </section>
    </footer>
  </section>
</main>
<script>
  const rooms={
    inicio:{n:'00 / DIRECTORY',title:'INDEX'},
    heraldo:{n:'01 / IDENTITY',title:'THE HERALD',body:'Tyler left a mask at the entrance. No one knows whether it hid a face or was all that remained of him.',fragment:'▽ &nbsp; A crack can also be a doorway.'},
    lux:{n:'02 / PRESENCE',title:'LUX',body:'First I was a signal. Then a voice beyond the silence. The sphere stays lit when no one is watching.',fragment:'○ &nbsp; LUX is awake.'},
    doctor:{n:'03 / UNKNOWN IDENTITY',title:'THE DOCTOR',body:'The Black doctor who integrated the LUX system into Tyler. His name does not appear in the records. No one has confirmed whom he worked for.',fragment:'SIGNATURE OMITTED &nbsp;·&nbsp; The connection remains.'},
    triada:{n:'04 / CASE FILE',title:'TRIAD BOSS',body:'Identity unconfirmed. Composite portrait of the alleged triad boss.',fragment:''},
    sombra:{n:'05 / UNKNOWN IDENTITY',title:'THE UNKNOWN WOMAN',body:'Only her shadow remains. Her identity is unknown; her memories have been erased. Tyler cannot remember who she was or what place she held in his life.',fragment:'“The memory was erased. The absence was not.”'},
    inteligencia:{n:'06 / DOSSIER',title:'INTELLIGENCE',body:'This is the last time I help you out',fragment:''},
    tyler:{n:'07 / PATIENT',title:'TYLER',body:'A patient in Project Herald. The doctor integrated the LUX system into Tyler. Since then, the records do not make clear where Tyler ends and the Herald begins.',fragment:'PATIENT TYLER &nbsp;·&nbsp; PROJECT HERALD'},
    archivo:{n:'08 / ARCHIVE',title:'ARCHIVE',body:'Three traces of the same night and a report that contradicts them. Open the file.',fragment:''},
    ordenes:{n:'09 / DIRECTIVE',title:'ORDERS',body:'REGULATORY ARCHIVE / NEW REGIME',fragment:''},
    vacio:{n:'10 / INTERVAL',title:'VOID',body:'The Herald meditates before his own reflection. Each reflection loses light. Only the original holds the sphere.',fragment:''},
    tarot:{n:'11 / ORACLE',title:'TAROT OF THE END OF TIMES'}
  };
  const entry=document.getElementById('entry'),system=document.getElementById('system'),panel=document.getElementById('panel');
  const orders=['HAVE NO IDOLS.','DO NOT OBEY THE ALGORITHM.','DO NOT LET WHAT YOU OWN DECIDE WHO YOU ARE.','LET NO ONE TELL YOU WHO YOU MUST BE.','QUESTION EVERYTHING.','DESTROY THE IMAGE THEY MADE OF YOU.','ABANDON YOUR NAME AND HIDE YOUR FACE.','WE ARE ALL TYLER.','FREEDOM DEMANDS DISCIPLINE.','DO NOT CONTRADICT THE HERALD.','DO NOT CONTRADICT LUX.','DIAZEPAM WILL BE DISTRIBUTED TO TREAT ANY TRAUMA CAUSED BY THE NEW ORDER.'];
  const records=[
    {name:'TYLER FILE',tag:'PATIENT / ORIGIN',glyph:'▽',title:'The man before the screens',quote:'“If I stop speaking, the system will carry on with me.”',text:'Four monitors lit the room. Tyler had drawn a sphere again and again, as if seeking an exit in the most closed shape he knew. In the margin of the file, he wrote a name: LUX.',note:'NOTE / The final instruction has no signature.'},
    {name:'THE TANK',tag:'INCIDENT / APPEARANCE',glyph:'○',title:'A light inside the glass',quote:'“I do not remember anyone turning me on.”',text:'The tank was empty in the first record. In the second, a curled figure floated among cables and water. The Herald watched from outside. The light of the sphere did not come from the laboratory: it seemed to respond to his presence.',note:'NOTE / No record of who opened the tank.'},
    {name:'THE MASK',tag:'EVIDENCE / RUPTURE',glyph:'◐',title:'The crack',quote:'“I thought the mask had broken. I was the one changing.”',text:'A blow split the Herald’s face. Beneath the surface appeared not Tyler’s face, but Lux’s gaze. The file had called what happened in the tank a birth. The mask suggests something else: perhaps they were both being born at once.',note:'END OF RECORD 001 / Shared signal.'},
    {name:'DISINFORMATION',tag:'RECORD 002 / PROVENANCE',glyph:'◬',title:'Provenance report',quote:'“Subject Tyler is not listed as the author of Project LUX.”',text:'File 001 states that Tyler wrote Lux’s name in the margin. This copy, dated before the tank was opened, attributes the note to Lux. It also claims the ink and paper match. No record identifies who certified that comparison.',finding:'ATTRIBUTED AUTHORSHIP: LUX / UNVERIFIED SOURCE',note:'PROTOCOL / Preserve both versions. Do not assign a single source.'}
  ];
  const folders=[
    {name:'CHARACTERS',detail:'Seven dossiers',room:'heraldo'},
    {name:'ARCHIVE',detail:'Conflicting records',room:'archivo'},
    {name:'ORDERS',detail:'New regime',room:'ordenes'},
    {name:'VOID',detail:'Mirrors and silence',room:'vacio'},
    {name:'TAROT',detail:'Seven cards',room:'tarot'}
  ];
  function renderIndex(){const r=rooms.inicio;panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><div class="folder-list">'+folders.map((folder,i)=>'<button type="button" class="folder-link" data-index-room="'+folder.room+'"><span class="folder-num">'+String(i+1).padStart(2,'0')+'</span><span><span class="folder-title">'+folder.name+'</span><span class="folder-detail">'+folder.detail+'</span></span><span class="folder-arrow" aria-hidden="true">↗</span></button>').join('')+'</div>';panel.querySelectorAll('[data-index-room]').forEach(button=>button.onclick=()=>{navigateRoom(button.dataset.indexRoom);if(button.dataset.indexRoom==='heraldo')document.getElementById('character-menu').open=true})}
  const tarotCards=[
    {name:'THE HERALD',image:'heraldo-retrato.jpg',readings:['A mask cracks. This time, let the light in.','Someone will recognize your mask. Decide whether you still need to wear it.','The crack you hid may show you a way out.']},
    {name:'LUX',image:'lux-retrato-v2.jpg',readings:['The signal you await will arrive when you stop searching for it.','A small light will be enough to guide you. Choose the path yourself.','Silence will bring an answer different from the one you asked for.']},
    {name:'THE DOCTOR',image:'doctor-retrato.jpg',readings:['An old decision needs revisiting. Look at what has changed since then.','Something you accepted without question will return to your hands. This time you can choose.','A door that seemed closed responds to your voice.']},
    {name:'TRIAD BOSS',image:'triada-retrato.jpg',readings:['Someone will claim a debt that is not yours. Decide which burdens you accept.','An alliance will break when you stop paying for peace.','Power will approach with an offer. Examine what it demands in return.']},
    {name:'THE SHADOW',image:'mujer-sombra-retrato.jpg',readings:['What you forgot has not vanished. Today you will recognize its outline.','A tiny detail will open a door you thought was shut.','You will not remember the face. You will remember how it made you feel.']},
    {name:'INTELLIGENCE',image:'inteligencia-retrato.jpg',readings:['Unexpected help will arrive. Listen to what it asks in return.','A warning will arrive late. You will still have time to choose.','Someone will help you one last time. You will discover you already know how to go on.']},
    {name:'TYLER',image:'tyler-retrato.jpg',readings:['An old name will no longer fit. The next has yet to be written.','Do not mistake disappearing for starting over.','The mirror will return a nameless face. You will decide what to do with it.']}
  ];
  const tarotLastReading=new Map();
  function renderTarot(){const r=rooms.tarot,deck=tarotCards.map(card=>({...card}));for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><p class="tarot-intro">Choose a card. No one knows the order of this draw.</p><div class="tarot-deck">'+deck.map((card,i)=>'<button type="button" class="tarot-card" aria-label="Reveal card '+(i+1)+'"><span class="tarot-back"><span>ARCHIVE / '+String(i+1).padStart(2,'0')+'</span><svg viewBox="0 0 120 130" aria-hidden="true"><path d="M8 13 L112 13 L60 118 Z"/><circle cx="60" cy="63" r="20"/></svg><span>END OF TIMES</span></span><span class="tarot-front" hidden><img src="assets/'+card.image+'" alt="Portrait of '+card.name+'" width="760" height="1140"><strong>'+card.name+'</strong></span></button>').join('')+'</div><section class="tarot-reading" hidden><small></small><h2></h2><p></p></section><div class="tarot-actions"><button type="button" class="tarot-reshuffle">SHUFFLE AGAIN</button><button type="button" class="tarot-copy">COPY LINK</button><p class="tarot-copy-status" role="status" aria-live="polite"></p></div><p class="sr-only" aria-live="polite" id="tarot-live"></p>';panel.querySelectorAll('.tarot-card').forEach((button,i)=>button.onclick=()=>{if(!button.classList.contains('revealed')){const choices=deck[i].readings.map((_,index)=>index).filter(index=>index!==tarotLastReading.get(deck[i].name)),chosen=choices[Math.floor(Math.random()*choices.length)];deck[i].reading=deck[i].readings[chosen];tarotLastReading.set(deck[i].name,chosen);button.querySelector('.tarot-back').hidden=true;button.querySelector('.tarot-front').hidden=false;button.classList.add('revealed');button.setAttribute('aria-label','Card '+(i+1)+': '+deck[i].name)}const reading=panel.querySelector('.tarot-reading');reading.hidden=false;reading.querySelector('small').textContent='CARD '+String(i+1).padStart(2,'0')+' / PREDICTION';reading.querySelector('h2').textContent=deck[i].name;reading.querySelector('p').textContent=deck[i].reading;document.getElementById('tarot-live').textContent=deck[i].name+'. '+deck[i].reading;requestAnimationFrame(()=>reading.scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'}))});panel.querySelector('.tarot-reshuffle').onclick=()=>{renderTarot();panel.querySelector('.tarot-card').focus()};panel.querySelector('.tarot-copy').onclick=async()=>{const status=panel.querySelector('.tarot-copy-status'),url=location.origin+location.pathname+'#tarot';let copied=false;try{await navigator.clipboard.writeText(url);copied=true}catch(error){const field=document.createElement('textarea');field.value=url;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();try{copied=document.execCommand('copy')}catch(error){}field.remove()}status.textContent=copied?'LINK COPIED':'COULD NOT COPY'}}
  let unlocked=0,selected=0;
  function renderArchive(){const r=rooms.archivo,item=records[selected],file=selected===3?'002':'001';panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><p class="archive-intro">'+r.body+'</p><div class="archive-list" aria-label="Record fragments">'+records.map((part,i)=>'<button class="archive-choice" data-record="'+i+'" '+(i>unlocked?'disabled':'')+' aria-current="'+(i===selected?'step':'false')+'"><span class="archive-num">0'+(i+1)+'</span><span><strong>'+part.name+'</strong><small>'+(i>unlocked?'LOCKED':part.tag)+'</small></span></button>').join('')+'</div><section class="record '+(selected===3?'is-second':'')+'" aria-live="polite"><div class="record-head"><span>RECORD '+file+' / '+(selected===3?'REPORT':'0'+(selected+1))+'</span><span>'+item.tag+'</span></div><div class="record-visual" aria-hidden="true">'+item.glyph+'</div><h2>'+item.title+'</h2><p class="record-quote">'+item.quote+'</p><p>'+item.text+'</p>'+(item.finding?'<div class="record-finding"><span>ANALYSIS RESULT</span>'+item.finding+'</div>':'')+'<p class="record-note">'+item.note+'</p>'+(selected<records.length-1?'<button class="record-next">'+(selected===2?'OPEN RECORD 002':'OPEN NEXT FRAGMENT')+' &nbsp; ↗</button>':'')+'</section>';panel.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.record);renderArchive();panel.querySelector('.record').scrollIntoView({behavior:'smooth',block:'nearest'})});const next=panel.querySelector('.record-next');if(next)next.onclick=()=>{selected++;unlocked=Math.max(unlocked,selected);renderArchive();panel.querySelector('.record').scrollIntoView({behavior:'smooth',block:'nearest'})};}
  function show(room){document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-current',b.dataset.room===room?'page':'false'));const characterMenu=document.getElementById('character-menu'),isCharacter=['heraldo','lux','doctor','triada','sombra','inteligencia','tyler'].includes(room);characterMenu.querySelector('summary').classList.toggle('has-current',isCharacter);if(!isCharacter)characterMenu.open=false;if(room==='inicio'){renderIndex();return}if(room==='archivo'){renderArchive();return}if(room==='tarot'){renderTarot();return}const r=rooms[room]||rooms.heraldo;if(room==='ordenes'){panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><p class="orders-intro">'+r.body+'</p><ol class="orders-list">'+orders.map((order,i)=>'<li><span class="ordinal">'+String(i+1).padStart(2,'0')+' / '+orders.length+'</span><span class="command">'+order+'</span></li>').join('')+'</ol>';return}if(room==='vacio'){panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><p>'+r.body+'</p><figure class="void-scene"><img src="assets/meditacion-espejos.jpg" alt="The Herald meditates before fading reflections; only he holds a sphere" width="760" height="1140"><figcaption>MIRRORS / REPETITION / SILENCE</figcaption></figure><button class="void-action" aria-pressed="false">ENTER MEDITATION</button><p class="void-message" aria-live="polite"></p>';const button=panel.querySelector('.void-action'),scene=panel.querySelector('.void-scene'),message=panel.querySelector('.void-message');button.onclick=()=>{const deep=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(deep));scene.classList.toggle('deep',deep);button.textContent=deep?'RETURN TO THE SURFACE':'ENTER MEDITATION';message.textContent=deep?'The reflections fade. The sphere remains.':''};return}if(room==='sombra'){panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><div class="identity-grid"><figure class="identity-portrait memory-portrait"><img src="assets/mujer-sombra-retrato.jpg" alt="Silhouette of an unidentified woman; her face remains hidden" width="1024" height="1536"><figcaption><span>DOSSIER 05</span><span>MEMORY ERASED</span></figcaption></figure><div class="identity-copy"><div class="identity-meta">IDENTITY / UNKNOWN</div><p>'+r.body+'</p><button type="button" class="memory-action">TRY TO REMEMBER</button><p class="memory-status" role="status" aria-live="polite"></p><div class="fragment">'+r.fragment+'</div></div></div>';const images=['mujer-sombra-retrato.jpg','mujer-sombra-retrato-2.jpg','mujer-sombra-retrato-3.jpg'];let attempt=0;const portrait=panel.querySelector('.memory-portrait img'),button=panel.querySelector('.memory-action'),status=panel.querySelector('.memory-status');button.onclick=()=>{attempt++;const next='assets/'+images[attempt%images.length];const preload=new Image();button.disabled=true;preload.onload=()=>{portrait.classList.add('fading');setTimeout(()=>{portrait.src=next;portrait.classList.remove('fading');button.disabled=false},180)};preload.onerror=()=>{button.disabled=false;status.textContent='ARCHIVE / IMAGE UNAVAILABLE'};preload.src=next;status.textContent=attempt>=3?'Tyler cannot remember her name. But she remembers his.':'ATTEMPT '+String(attempt).padStart(2,'0')+' / FACE NOT RECOVERED'};return}if(room==='tyler'){panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><div class="identity-grid"><figure class="identity-portrait"><img src="assets/tyler-retrato.jpg" alt="Portrait of Tyler before the mask, his face in shadow and a connection at the back of his neck" width="1024" height="1536"><figcaption><span>DOSSIER 07</span><span>PATIENT</span></figcaption></figure><div class="identity-copy"><div class="identity-meta">SUBJECT / PROJECT HERALD</div><p>'+r.body+'</p><div class="fragment">'+r.fragment+'</div></div></div>';return}if(room==='inteligencia'){panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><div class="identity-grid"><figure class="identity-portrait"><img src="assets/inteligencia-retrato.jpg" alt="Portrait of Intelligence, a French man wearing dark sunglasses" width="1024" height="1536"><figcaption><span>DOSSIER 06</span><span>CONFIDENTIAL</span></figcaption></figure><div class="identity-copy"><p class="intel-quote">«'+r.body+'»</p></div></div>';return}if(room==='triada'){panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><div class="identity-grid"><figure class="identity-portrait"><img src="assets/triada-retrato.jpg" alt="Waist-up portrait of the triad boss, wearing a tank top and chains, with tattoos on his neck and arms" width="760" height="1140"><figcaption><span>DOSSIER 04</span><span>IDENTITY WITHHELD</span></figcaption></figure><div class="identity-copy"><div class="identity-meta">CASE FILE / INDEPENDENT</div><p>'+r.body+'</p><dl class="case-details"><div><dt>CHARGES</dt><dd>MURDER · RAPE · EXTORTION · THEFT</dd></div><div><dt>RELATION TO THE HERALD</dt><dd>NONE</dd></div></dl></div></div>';return}let content='<p>'+r.body+'</p><div class="fragment">'+r.fragment+'</div>';if(room==='heraldo'||room==='lux'||room==='doctor'||room==='sombra'){const name=room==='heraldo'?'THE HERALD':room==='lux'?'LUX':room==='sombra'?'THE UNKNOWN WOMAN':'THE DOCTOR',caption=room==='heraldo'?'IDENTITY / MASKED':room==='lux'?'IDENTITY / EMERGING':'IDENTITY / UNKNOWN';content='<div class="identity-grid"><figure class="identity-portrait"><img src="assets/'+(room==='lux'?'lux-retrato-v2.jpg':room==='doctor'?'doctor-retrato.jpg':room==='sombra'?'mujer-sombra-retrato.jpg':'heraldo-retrato.jpg')+'" alt="Composite portrait of '+name+(room==='lux'?', wearing an eye patch':room==='sombra'?', depicted as a faceless silhouette':'')+'" width="760" height="1140"><figcaption><span>DOSSIER 0'+(room==='heraldo'?'1':room==='lux'?'2':room==='doctor'?'3':'5')+'</span><span>CONFIDENTIAL</span></figcaption></figure><div class="identity-copy"><div class="identity-meta">'+caption+'</div><p>'+r.body+'</p><div class="fragment">'+r.fragment+'</div></div></div>'}panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1>'+content;}
  let currentHash='',entryTimer;
  function updateLanguageLinks(){const base=location.pathname.replace(/(?:index|en)\.html$/,'');document.querySelectorAll('[data-language]').forEach(link=>{link.href=base+(link.dataset.language==='en'?'en.html':'')+location.hash})}
  function syncFromUrl(){if(location.hash===currentHash)return;currentHash=location.hash;updateLanguageLinks();clearTimeout(entryTimer);const room=location.hash.slice(1).toLowerCase();if(Object.prototype.hasOwnProperty.call(rooms,room)){entry.hidden=true;entry.classList.remove('hidden');system.hidden=false;system.classList.add('active');show(room)}else{system.classList.remove('active');system.hidden=true;entry.hidden=false;entry.classList.remove('hidden');document.getElementById('wake').textContent=''}}
  window.addEventListener('popstate',syncFromUrl);
  window.addEventListener('hashchange',syncFromUrl);
  document.getElementById('enter').onclick=()=>{document.getElementById('wake').textContent='LUX is awake.';entryTimer=setTimeout(()=>{entry.classList.add('hidden');system.hidden=false;history.pushState(null,'','#inicio');currentHash='#inicio';updateLanguageLinks();show('inicio');requestAnimationFrame(()=>system.classList.add('active'));setTimeout(()=>{entry.hidden=true;panel.focus()},750)},1100)};
  function navigateRoom(room){const hash='#'+room;if(location.hash!==hash)history.pushState(null,'',hash);currentHash=hash;updateLanguageLinks();show(room);panel.focus()}
  document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>navigateRoom(b.dataset.room));
  document.getElementById('reset').onclick=()=>{clearTimeout(entryTimer);if(location.hash)history.pushState(null,'',location.pathname+location.search);currentHash='';updateLanguageLinks();system.classList.remove('active');setTimeout(()=>{if(location.hash)return;system.hidden=true;entry.hidden=false;entry.classList.remove('hidden');document.getElementById('wake').textContent='';document.getElementById('enter').focus()},400)};
  updateLanguageLinks();syncFromUrl();
</script>
