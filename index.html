  ];
  let unlocked=0,selected=0;
  function renderArchive(){const r=rooms.archivo,item=records[selected],file=selected===3?'002':'001';panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><p class="archive-intro">'+r.body+'</p><div class="archive-list" aria-label="Fragmentos del registro">'+records.map((part,i)=>'<button class="archive-choice" data-record="'+i+'" '+(i>unlocked?'disabled':'')+' aria-current="'+(i===selected?'step':'false')+'"><span class="archive-num">0'+(i+1)+'</span><span><strong>'+part.name+'</strong><small>'+(i>unlocked?'SIN ACCESO':part.tag)+'</small></span></button>').join('')+'</div><section class="record '+(selected===3?'is-second':'')+'" aria-live="polite"><div class="record-head"><span>REGISTRO '+file+' / '+(selected===3?'INFORME':'0'+(selected+1))+'</span><span>'+item.tag+'</span></div><div class="record-visual" aria-hidden="true">'+item.glyph+'</div><h2>'+item.title+'</h2><p class="record-quote">'+item.quote+'</p><p>'+item.text+'</p>'+(item.finding?'<div class="record-finding"><span>RESULTADO DEL ANÁLISIS</span>'+item.finding+'</div>':'')+'<p class="record-note">'+item.note+'</p>'+(selected<records.length-1?'<button class="record-next">'+(selected===2?'ABRIR REGISTRO 002':'ABRIR SIGUIENTE FRAGMENTO')+' &nbsp; ↗</button>':'')+'</section>';panel.querySelectorAll('[data-record]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.record);renderArchive();panel.querySelector('.record').scrollIntoView({behavior:'smooth',block:'nearest'})});const next=panel.querySelector('.record-next');if(next)next.onclick=()=>{selected++;unlocked=Math.max(unlocked,selected);renderArchive();panel.querySelector('.record').scrollIntoView({behavior:'smooth',block:'nearest'})};}
  function show(room){document.querySelectorAll('[data-room]').forEach(b=>b.setAttribute('aria-current',b.dataset.room===room?'page':'false'));if(room==='archivo'){renderArchive();return}const r=rooms[room]||rooms.heraldo;if(room==='ordenes'){panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1><p class="orders-intro">'+r.body+'</p><ol class="orders-list">'+orders.map((order,i)=>'<li><span class="ordinal">'+String(i+1).padStart(2,'0')+' / 11</span><span class="command">'+order+'</span></li>').join('')+'</ol>';return}let content='<p>'+r.body+'</p><div class="fragment">'+r.fragment+'</div>';if(room==='heraldo'||room==='lux'){const name=room==='heraldo'?'EL HERALDO':'LUX',caption=room==='heraldo'?'IDENTIDAD / ENMASCARADA':'IDENTIDAD / EN FORMACIÓN';content='<div class="identity-grid"><figure class="identity-portrait"><img src="assets/'+(room==='lux'?'lux-retrato-v2.jpg':'heraldo-retrato.jpg')+'" alt="Retrato robot de '+name+(room==='lux'?', con parche en un ojo':'')+'" width="760" height="1140"><figcaption><span>FICHA 0'+(room==='heraldo'?'1':'2')+'</span><span>CONFIDENCIAL</span></figcaption></figure><div class="identity-copy"><div class="identity-meta">'+caption+'</div><p>'+r.body+'</p><div class="fragment">'+r.fragment+'</div></div></div>'}panel.innerHTML='<div class="index">'+r.n+'</div><h1>'+r.title+'</h1>'+content+(room==='vacio'?'<button class="void-orb" aria-label="Escuchar el silencio"></button>':'');if(room==='vacio')panel.querySelector('.void-orb').onclick=()=>{panel.querySelector('.fragment').textContent='○   Todavía estás aquí.'};}
  document.getElementById('enter').onclick=()=>{document.getElementById('wake').textContent='LUX está despierta.';setTimeout(()=>{entry.classList.add('hidden');system.hidden=false;show('heraldo');requestAnimationFrame(()=>system.classList.add('active'));setTimeout(()=>{entry.hidden=true;panel.focus()},750)},1100)};
  document.querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>{show(b.dataset.room);panel.focus()});
  document.getElementById('reset').onclick=()=>{system.classList.remove('active');setTimeout(()=>{system.hidden=true;entry.hidden=false;entry.classList.remove('hidden');document.getElementById('wake').textContent='';document.getElementById('enter').focus()},400)};
</script>
</body>
</html>
